<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile - ISOTOPES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient sticky-top"><div class="container-fluid"><a class="navbar-brand fw-bold" href="student-dashboard.html"><i class="fas fa-dna"></i> ISOTOPES</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="student-dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link active" href="student-profile.html">Profile</a></li><li class="nav-item"><a class="nav-link" href="skill-assessment.html">Assessment</a></li><li class="nav-item"><a class="nav-link" href="skill-gap-analysis.html">Skill Gap</a></li><li class="nav-item"><a class="nav-link" href="opportunities.html">Opportunities</a></li><li class="nav-item"><button class="btn btn-link nav-link" id="logoutButton">Logout</button></li></ul></div></div></nav>
  <main class="container py-5"><div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index:1080"></div><h2 class="fw-bold mb-1">My Profile</h2><p class="text-muted mb-4">Changes are saved to your account and remain available when you sign in again.</p>
    <ul class="nav nav-tabs mb-4"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#basic" type="button">Basic info</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#education" type="button">Education</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#experience" type="button">Experience</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#projects" type="button">Projects</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#certifications" type="button">Certifications</button></li></ul>
    <div class="tab-content">
      <section class="tab-pane fade show active" id="basic"><div class="card border-0 shadow-sm"><div class="card-body p-4"><form id="basicInfoForm"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" required></div><div class="col-md-6"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" readonly></div><div class="col-md-6"><label class="form-label" for="phone">Phone number</label><input class="form-control" id="phone"></div><div class="col-md-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" placeholder="City, State"></div><div class="col-12"><label class="form-label" for="headline">Professional headline</label><input class="form-control" id="headline" placeholder="e.g. Computer Science student"></div><div class="col-12"><label class="form-label" for="bio">About you</label><textarea class="form-control" id="bio" rows="4"></textarea></div></div><button class="btn btn-primary mt-4" type="submit">Save changes</button></form></div></div></section>
      <section class="tab-pane fade" id="education"><div class="card border-0 shadow-sm"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Education</h5><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#educationModal">Add education</button></div><div id="educationList"></div></div></div></section>
      <section class="tab-pane fade" id="experience"><div class="card border-0 shadow-sm"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Experience</h5><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#experienceModal">Add experience</button></div><div id="experienceList"></div></div></div></section>
      <section class="tab-pane fade" id="projects"><div class="card border-0 shadow-sm"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Projects</h5><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#projectModal">Add project</button></div><div id="projectList"></div></div></div></section>
      <section class="tab-pane fade" id="certifications"><div class="card border-0 shadow-sm"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Certifications</h5><button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#certificationModal">Add certification</button></div><div id="certificationList"></div></div></div></section>
    </div>
  </main>
  <div class="modal fade" id="educationModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="educationForm"><div class="modal-header"><h5 class="modal-title">Add education</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body row g-3"><div class="col-12"><label class="form-label">Degree</label><input class="form-control" name="degree" required></div><div class="col-12"><label class="form-label">Institution</label><input class="form-control" name="institution" required></div><div class="col-md-6"><label class="form-label">Start date</label><input class="form-control" name="startDate" type="date"></div><div class="col-md-6"><label class="form-label">End date</label><input class="form-control" name="endDate" type="date"></div><div class="col-12"><label class="form-label">CGPA</label><input class="form-control" name="cgpa" type="number" min="0" max="10" step="0.01"></div></div><div class="modal-footer"><button class="btn btn-primary" type="submit">Save education</button></div></form></div></div>
  <div class="modal fade" id="experienceModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="experienceForm"><div class="modal-header"><h5 class="modal-title">Add experience</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body row g-3"><div class="col-md-6"><label class="form-label">Job title</label><input class="form-control" name="jobTitle" required></div><div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company" required></div><div class="col-md-6"><label class="form-label">Start date</label><input class="form-control" name="startDate" type="date"></div><div class="col-md-6"><label class="form-label">End date</label><input class="form-control" name="endDate" type="date"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description"></textarea></div></div><div class="modal-footer"><button class="btn btn-primary" type="submit">Save experience</button></div></form></div></div>
  <div class="modal fade" id="projectModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="projectForm"><div class="modal-header"><h5 class="modal-title">Add project</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body row g-3"><div class="col-12"><label class="form-label">Project title</label><input class="form-control" name="title" required></div><div class="col-12"><label class="form-label">Skills (comma-separated)</label><input class="form-control" name="skills" placeholder="Python, React"></div><div class="col-12"><label class="form-label">Project link</label><input class="form-control" name="link" type="url"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description"></textarea></div></div><div class="modal-footer"><button class="btn btn-primary" type="submit">Save project</button></div></form></div></div>
  <div class="modal fade" id="certificationModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="certificationForm"><div class="modal-header"><h5 class="modal-title">Add certification</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body row g-3"><div class="col-md-6"><label class="form-label">Certification name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Provider</label><input class="form-control" name="provider" required></div><div class="col-12"><label class="form-label">Issue date</label><input class="form-control" name="issueDate" type="date"></div><div class="col-12"><label class="form-label">Credential link</label><input class="form-control" name="link" type="url"></div></div><div class="modal-footer"><button class="btn btn-primary" type="submit">Save certification</button></div></form></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
  <script>
    const escapeHtml = (v = '') => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateLabel = v => v ? new Date(v).toLocaleDateString(undefined, {year:'numeric',month:'short'}) : '';
    const values = form => Object.fromEntries(new FormData(form).entries()); let profile;
    const empty = message => `<p class="text-muted mb-0">${message}</p>`; const remove = (type,id) => `<button class="btn btn-outline-danger btn-sm" data-delete="${type}" data-id="${id}">Delete</button>`;
    function render() { const u=profile.user||{}, s=profile.student; ['name','email','phone','location','bio','headline'].forEach(key => document.getElementById(key).value = key==='headline' ? s.headline||'' : u[key]||''); document.getElementById('educationList').innerHTML=s.education.length?s.education.map(x=>`<div class="p-3 mb-2 bg-light rounded"><div class="d-flex justify-content-between"><div><strong>${escapeHtml(x.degree)}</strong><div class="text-muted">${escapeHtml(x.institution)} · ${dateLabel(x.startDate)} – ${dateLabel(x.endDate)}</div>${x.cgpa!==undefined?`<small>CGPA: ${escapeHtml(x.cgpa)}</small>`:''}</div>${remove('education',x._id)}</div></div>`).join(''):empty('No education added yet.'); document.getElementById('experienceList').innerHTML=s.experience.length?s.experience.map(x=>`<div class="p-3 mb-2 bg-light rounded"><div class="d-flex justify-content-between"><div><strong>${escapeHtml(x.jobTitle)}</strong><div class="text-muted">${escapeHtml(x.company)} · ${dateLabel(x.startDate)} – ${dateLabel(x.endDate)}</div><small>${escapeHtml(x.description)}</small></div>${remove('experience',x._id)}</div></div>`).join(''):empty('No experience added yet.'); document.getElementById('projectList').innerHTML=s.projects.length?s.projects.map(x=>`<div class="p-3 mb-2 bg-light rounded"><div class="d-flex justify-content-between"><div><strong>${escapeHtml(x.title)}</strong><div class="text-muted small">${escapeHtml(x.description)}</div><div>${(x.skills||[]).map(y=>`<span class="badge bg-primary me-1">${escapeHtml(y)}</span>`).join('')}</div>${x.link?`<a class="small" href="${escapeHtml(x.link)}" target="_blank" rel="noopener">View project</a>`:''}</div>${remove('project',x._id)}</div></div>`).join(''):empty('No projects added yet.'); document.getElementById('certificationList').innerHTML=s.certifications.length?s.certifications.map(x=>`<div class="p-3 mb-2 bg-light rounded"><div class="d-flex justify-content-between"><div><strong>${escapeHtml(x.name)}</strong><div class="text-muted">${escapeHtml(x.provider)} · ${dateLabel(x.issueDate)}</div>${x.link?`<a class="small" href="${escapeHtml(x.link)}" target="_blank" rel="noopener">View credential</a>`:''}</div>${remove('certification',x._id)}</div></div>`).join(''):empty('No certifications added yet.'); }
    async function load() { const result=await fetchStudentProfile(); if(!result.success)return showError(result.error||'Could not load your profile'); profile=result; render(); }
    async function add(event, action, modal) { event.preventDefault(); const result=await action(values(event.currentTarget)); if(!result.success)return showError(result.error||'Could not save'); profile.student=result.student; event.currentTarget.reset(); bootstrap.Modal.getInstance(document.getElementById(modal)).hide(); render(); showSuccess('Saved successfully'); }
    document.getElementById('basicInfoForm').addEventListener('submit',async e=>{e.preventDefault();const result=await updateStudentProfile(values(e.currentTarget));if(!result.success)return showError(result.error||'Could not save');profile={student:result.student,user:result.user};localStorage.setItem('userName',result.user.name);render();showSuccess('Profile saved');});
    document.getElementById('educationForm').addEventListener('submit',e=>add(e,addEducation,'educationModal')); document.getElementById('experienceForm').addEventListener('submit',e=>add(e,addExperience,'experienceModal')); document.getElementById('certificationForm').addEventListener('submit',e=>add(e,addCertification,'certificationModal')); document.getElementById('projectForm').addEventListener('submit',e=>{const data=values(e.currentTarget);data.skills=data.skills?data.skills.split(',').map(x=>x.trim()).filter(Boolean):[];e.preventDefault();return add({preventDefault(){},currentTarget:e.currentTarget},()=>addProject(data),'projectModal');});
    document.addEventListener('click',async e=>{const b=e.target.closest('[data-delete]');if(!b||!confirm('Delete this item?'))return;const actions={education:deleteEducation,experience:deleteExperience,project:deleteProject,certification:deleteCertification};const result=await actions[b.dataset.delete](b.dataset.id);if(!result.success)return showError(result.error||'Could not delete');profile.student=result.student;render();showSuccess('Deleted successfully');}); document.getElementById('logoutButton').addEventListener('click',logoutUser); load();
  </script>
</body>
</html>
